plugins { id 'com.android.application' }
android {
  namespace 'com.saadeh.sadex'
  compileSdk 34
  defaultConfig {
    applicationId 'com.saadeh.sadex'
    minSdk 24
    targetSdk 34
    versionCode (System.getenv('SADEX_VERSION_CODE') ?: '1') as int
    versionName System.getenv('SADEX_VERSION_NAME') ?: '1.0.0'
  }
  signingConfigs {
    release {
      // NOTE: this repository is public; move the keystore and password into GitHub Actions secrets when possible.
      storeFile file('sadex-release.jks')
      storePassword System.getenv('SADEX_KEY_PASS') ?: '2e94da63958b7a26a8240c44'
      keyAlias 'sadex'
      keyPassword System.getenv('SADEX_KEY_PASS') ?: '2e94da63958b7a26a8240c44'
    }
  }
  buildFeatures { buildConfig true }
  lint { checkReleaseBuilds false; abortOnError false }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0'; implementation 'androidx.core:core:1.13.1' }
